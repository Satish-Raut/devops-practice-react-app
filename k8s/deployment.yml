
apiVersion: apps/v1
kind: Deployment  # The kind of Object we want to create

metadata:
  name: react-app-deployment
  labels:
    app: react-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app
    
    spec:
      containers:
      - name: react-app-container
        image: devenvsatish/k8s-react-app:v1
        ports:
        - containerPort: 80

  